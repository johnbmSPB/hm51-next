name: One-time direct calendar migration

on:
  push:
    branches:
      - feature/global-data-direct-calendar-20260722

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-data-direct-calendar-20260722
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch calendar to consume global revisions directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path("app/calendar/page.tsx")
          text = page_path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { getScopedItem } from "../lib/accountStorage";\n',
              'import { getScopedItem } from "../lib/accountStorage";\nimport { useAppData } from "../lib/AppDataProvider";\n',
              "AppDataProvider import",
          )

          replace_once(
              'export default function CalendarPage() {\n  const [token, setToken] = useState("");\n',
              'export default function CalendarPage() {\n  const { profileRevision, eventsRevision } = useAppData();\n  const handledProfileRevision = useRef(profileRevision);\n  const handledEventsRevision = useRef(eventsRevision);\n  const [token, setToken] = useState("");\n',
              "CalendarPage hook",
          )

          events_effect = '''  useEffect(() => {
              if (!token || profileLoading) return;

              if (teams.length === 0) {
                setEvents([]);
                setLoading(false);
                return;
              }

              void loadEvents(token);
            }, [
              token,
              profileLoading,
              teams,
              range.date1,
              range.date2,
            ]);
          '''

          revision_effects = events_effect + '''
            useEffect(() => {
              if (!token || handledProfileRevision.current === profileRevision) return;

              handledProfileRevision.current = profileRevision;
              void loadProfile(token, true);
            }, [profileRevision, token]);

            useEffect(() => {
              if (
                !token ||
                profileLoading ||
                handledEventsRevision.current === eventsRevision
              ) {
                return;
              }

              handledEventsRevision.current = eventsRevision;

              if (teams.length === 0) {
                setEvents([]);
                return;
              }

              void loadEvents(token, true);
            }, [
              eventsRevision,
              token,
              profileLoading,
              teams,
              range.date1,
              range.date2,
            ]);
          '''
          replace_once(events_effect, revision_effects, "revision effects")

          replace_once(
              '  async function loadProfile(currentToken: string) {\n    try {\n      setProfileLoading(true);\n      setProfileError("");\n',
              '  async function loadProfile(currentToken: string, silent = false) {\n    try {\n      if (!silent) {\n        setProfileLoading(true);\n        setProfileError("");\n      }\n',
              "loadProfile start",
          )

          replace_once(
              '    } finally {\n      setProfileLoading(false);\n    }\n  }\n\n  async function loadPhoto',
              '    } finally {\n      if (!silent) setProfileLoading(false);\n    }\n  }\n\n  async function loadPhoto',
              "loadProfile finally",
          )

          replace_once(
              '  async function loadEvents(currentToken: string) {\n    try {\n      setLoading(true);\n      setError("");\n      setMessage("");\n',
              '  async function loadEvents(currentToken: string, silent = false) {\n    try {\n      if (!silent) {\n        setLoading(true);\n        setError("");\n        setMessage("");\n      }\n',
              "loadEvents start",
          )

          replace_once(
              '    } catch (err) {\n      setError(err instanceof Error ? err.message : "Ошибка календаря");\n    } finally {\n      setLoading(false);\n    }\n  }\n\n  async function loadEventPlayers',
              '    } catch (err) {\n      if (!silent) {\n        setError(err instanceof Error ? err.message : "Ошибка календаря");\n      }\n    } finally {\n      if (!silent) setLoading(false);\n    }\n  }\n\n  async function loadEventPlayers',
              "loadEvents finish",
          )

          page_path.write_text(text)

          layout_path = Path("app/calendar/layout.tsx")
          layout_path.write_text('''import type { ReactNode } from "react";\n\nexport default function CalendarLayout({ children }: { children: ReactNode }) {\n  return children;\n}\n''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified migration and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/direct-calendar-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/calendar/page.tsx app/calendar/layout.tsx .github/workflows/direct-calendar-migration.yml
          git commit -m "Connect calendar directly to global data revisions"
          git push origin HEAD:feature/global-data-direct-calendar-20260722
