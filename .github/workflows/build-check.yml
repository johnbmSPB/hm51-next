name: Build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci > /dev/null 2>&1
      - name: Run tests
        run: npm test > /dev/null 2>&1
      - name: Build with concise diagnostics
        run: npm run build > build.log 2>&1 || (tail -n 80 build.log && exit 1)
