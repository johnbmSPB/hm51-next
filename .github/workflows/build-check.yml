name: Build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci > /dev/null 2>&1
      - name: Run tests
        run: npm test > /dev/null 2>&1
      - name: Capture build diagnostics
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          echo "$status" > build-status.txt
          exit 0
      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: p0-3-build-diagnostics
          path: |
            build.log
            build-status.txt
          retention-days: 1
      - name: Fail when build failed
        shell: bash
        run: |
          status=$(cat build-status.txt)
          if [ "$status" != "0" ]; then
            exit "$status"
          fi
