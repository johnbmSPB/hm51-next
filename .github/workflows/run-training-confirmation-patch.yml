name: Run training confirmation patch

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    if: github.event.pull_request.title == 'Run training confirmation patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python3 scripts/patch-training-confirmation.py

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish verified changes
        shell: bash
        run: |
          rm -f scripts/patch-training-confirmation.py
          rm -f .github/workflows/patch-training-confirmation.yml
          rm -f .github/workflows/run-training-confirmation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/events/route.ts app/calendar/page.tsx public/hm51-push-sw.js tests/pushNotificationText.test.mjs scripts/patch-training-confirmation.py .github/workflows/patch-training-confirmation.yml .github/workflows/run-training-confirmation-patch.yml
          git commit -m "Show training lineup confirmation details"
          git push origin HEAD:main

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body "Патч применён, тесты и production-сборка прошли успешно."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body "Патч не опубликован: один из шагов проверки завершился ошибкой. Run ID: ${{ github.run_id }}."
